{% extends "project/project_base.html" %}

{% block project_content %}
<section class="flex min-h-[360px] flex-col rounded-xl border border-slate-200 bg-white shadow-sm">
    <header class="flex items-center gap-3 border-b border-slate-100 p-5">
        <span class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand-50 text-brand-600">
            <i data-lucide="messages-square" class="h-5 w-5"></i>
        </span>
        <div>
            <h2 class="font-semibold text-slate-900">Project Chat</h2>
            <p class="text-sm text-slate-500">Keep project conversations together.</p>
        </div>
    </header>
    <div class="flex flex-1 flex-col items-center justify-center p-8 text-center">
        <i data-lucide="message-circle-more" class="h-10 w-10 text-slate-300"></i>
        <p class="mt-3 font-medium text-slate-700">Project chat is ready for your team</p>
        <p class="mt-1 max-w-md text-sm text-slate-500">Messages and chat history can be added here as a separate project feature.</p>
    </div>
</section>
{% endblock %}
