{% extends "project/project_base.html" %}

{% block project_content %}
<section>
    <div class="mb-5 flex items-center justify-between gap-4">
        <div>
            <h2 class="text-lg font-semibold text-slate-900">Kanban Board</h2>
            <p class="mt-1 text-sm text-slate-500">Organize project work by its current status.</p>
        </div>
        <i data-lucide="kanban" class="h-5 w-5 text-brand-600"></i>
    </div>
    <div class="grid gap-4 md:grid-cols-3">
        {% for column in ["To do", "In progress", "Done"] %}
        <section class="min-h-56 rounded-xl border border-slate-200 bg-slate-50 p-4">
            <h3 class="font-semibold text-slate-700">{{ column }}</h3>
            <div class="mt-4 rounded-lg border border-dashed border-slate-200 bg-white p-5 text-center text-sm text-slate-400">
                Tasks will appear here.
            </div>
        </section>
        {% endfor %}
    </div>
</section>
{% endblock %}
