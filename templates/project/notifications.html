{% extends "project/project_base.html" %}

{% block project_content %}
<section class="mt-6 rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="flex flex-col gap-3 border-b border-slate-100 p-5 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.14em] text-brand-600">Project updates</p>
            <h2 class="mt-1 text-xl font-semibold text-slate-900">Notifications</h2>
            <p class="mt-1 text-sm text-slate-500">Task assignments, status changes, and comments for this project.</p>
        </div>
        <button id="mark-all-project-notifications-read" type="button"
            class="hidden rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-600 transition hover:border-brand-200 hover:text-brand-700 disabled:cursor-not-allowed disabled:opacity-50">
            Mark all as read
        </button>
    </div>
    <p id="project-notifications-error" role="alert" aria-live="assertive"
        class="mx-5 mt-5 hidden rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    <div id="project-notifications-list" class="divide-y divide-slate-100" aria-live="polite">
        <p class="p-8 text-center text-sm text-slate-500">Loading notifications...</p>
    </div>
</section>
{% endblock %}

{% block scripts %}
{{ super() }}
<script src="/static/js/project_notifications.js?v=1" defer></script>
{% endblock %}
